<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">

  <!-- ==========================================================
       LINK PREVIEW (Messenger, Viber, etc.)
       These are read by link-preview bots, which do not run JavaScript,
       so this text lives here rather than in script.js.
       og:image / og:url must be ABSOLUTE urls: update them if the site
       is published somewhere other than the GitHub Pages address below.
       ========================================================== -->
  <title>TSD Christmas Party 2026 · You're Invited</title>
  <meta name="description" content="STRONGER: Wired for Greatness, Powered by Passion. December 18, 2026 · 5:00 PM onwards · SLD Events Pavilion, Lipa City.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TSD Christmas Party 2026 · You're Invited">
  <meta property="og:description" content="December 18, 2026 · 5:00 PM onwards · SLD Events Pavilion, Antipolo Del Norte, Lipa City. Tap to open your invitation.">
  <meta property="og:url" content="https://vivivinz.github.io/tsd-christmas-party-2026/">
  <meta property="og:image" content="https://vivivinz.github.io/tsd-christmas-party-2026/assets/og-cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A black envelope with a red wax seal: TSD Christmas Party 2026, You're Invited">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Pinyon+Script&family=Playfair+Display:wght@500&family=Quattrocento:wght@400;700&display=swap">

  <link rel="preload" as="image" href="assets/envelope-pocket.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/envelope-flap.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <!-- PROGRAM / DETAILS SECTION STYLES (replace in part 2) -->
  <link rel="stylesheet" href="details.css">
  <script defer src="script.js"></script>
</head>
<body class="is-locked">

  <main>
    <!-- =========================================================
         1. COVER: closed envelope
         ========================================================= -->
    <section class="cover" id="cover" aria-label="Invitation cover">
      <div class="stage cover-stage">

        <h1 class="cover-title anim" style="--d:0ms">
          <span class="cover-title__top" data-copy="cover.titleTop"></span>
          <span class="cover-title__main" data-copy="cover.titleMain"></span>
        </h1>

        <span class="disco-wrap anim" style="--d:450ms" aria-hidden="true">
          <img src="assets/disco-ball.webp" width="245" height="291" alt="" decoding="async">
          <span class="twinkles"><i></i><i></i><i></i><i></i></span>
        </span>

        <button class="envelope anim" style="--d:200ms" id="openBtn" type="button" aria-label="Open the invitation">
          <span class="envelope__float">
            <span class="envelope__body">
              <span class="envelope__back"></span>
              <!-- the card that slides out -->
              <span class="envelope__card">
                <span class="mini-card">
                  <span class="mini-card__theme" data-copy="card.theme"></span>
                  <span class="mini-card__line" data-copy="card.date"></span>
                  <span class="mini-card__line" data-copy="card.venue"></span>
                </span>
              </span>
              <img class="envelope__pocket" src="assets/envelope-pocket.webp" width="659" height="461" alt="">
              <!-- the top flap (front = artwork incl. top half of the seal, back = inside of the flap) -->
              <span class="envelope__flap">
                <span class="flap-face flap-face--front">
                  <span class="envelope__script" data-copy="cover.script"></span>
                </span>
                <span class="flap-face flap-face--back"></span>
              </span>
              <span class="seal-shine" aria-hidden="true"><i></i></span>
              <svg class="seal-crack" viewBox="0 0 659 461" aria-hidden="true" preserveAspectRatio="none">
                <path d="M262 212 L280 226 L290 222 L304 241 L313 238 L329 260 L344 239 L353 243 L366 224 L377 228 L397 212" />
              </svg>
            </span>
          </span>
        </button>

        <img class="deco flourish anim" style="--d:650ms" src="assets/gold-flourish.webp" width="243" height="253" alt="" decoding="async">
        <img class="deco champagne anim" style="--d:550ms" src="assets/champagne-glasses.webp" width="322" height="290" alt="" decoding="async">

        <p class="cover-prompt anim" style="--d:900ms"><span data-copy="cover.prompt"></span></p>
      </div>
    </section>

    <!-- =========================================================
         2. OPENED INVITATION
         ========================================================= -->
    <section class="scene" id="scene" aria-label="Invitation" hidden>
      <div class="stage scene-stage">
        <img class="s-item s-confetti" style="--d:150ms" data-anim="fade" src="assets/confetti.webp" width="816" height="595" alt="" decoding="async">
        <img class="s-item s-streamers s-streamers--l" style="--d:250ms" data-anim="drop" src="assets/streamers.webp" width="466" height="436" alt="" decoding="async">
        <img class="s-item s-streamers s-streamers--r" style="--d:330ms" data-anim="drop" src="assets/streamers.webp" width="466" height="436" alt="" decoding="async">
        <img class="s-item s-tree" style="--d:700ms" data-anim="rise" src="assets/christmas-tree.webp" width="520" height="777" alt="" decoding="async">

        <!-- envelope: back / card / front pocket -->
        <div class="s-item s-envelope" style="--d:0ms" data-anim="fade">
          <img class="s-envelope__back" src="assets/envelope-open-back.webp" width="882" height="816" alt="" decoding="async">
          <div class="s-card">
            <h2 class="s-card__theme" data-copy="card.theme" tabindex="-1" id="sceneHeading"></h2>
            <p class="s-card__venue">
              <a class="venue-link" id="venueLink" target="_blank" rel="noopener">
                <svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a7 7 0 0 0-7 7c0 5.1 6.1 11.4 6.4 11.7a.8.8 0 0 0 1.2 0C12.9 20.9 19 14.6 19 9.5a7 7 0 0 0-7-7Zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Z"/></svg><span data-copy="card.venue"></span><span class="sr-only"> (opens map in a new tab)</span>
              </a>
              <span class="s-card__address" data-copy="card.address"></span>
            </p>
            <span class="divider divider--wide" aria-hidden="true"></span>
            <p class="s-card__date" data-copy="card.date"></p>
            <span class="divider" aria-hidden="true"></span>
            <p class="s-card__time" data-copy="card.time"></p>
          </div>
          <img class="s-envelope__pocket" src="assets/envelope-open-pocket.webp" width="882" height="816" alt="" decoding="async">
        </div>

        <img class="s-item s-holly" style="--d:900ms" data-anim="drop" src="assets/holly.webp" width="216" height="184" alt="" decoding="async">
        <img class="s-item s-ornament" style="--d:780ms" data-anim="swing" src="assets/red-ornament.webp" width="184" height="311" alt="" decoding="async">

        <div class="s-item s-label" style="--d:450ms" data-anim="rise">
          <img src="assets/cream-label.webp" width="880" height="585" alt="" decoding="async">
          <img class="s-label__squiggle" src="assets/gold-squiggle.webp" width="446" height="46" alt="" decoding="async">
          <p class="s-label__text">
            <span class="s-label__line1" data-copy="label.line1"></span>
            <span class="s-label__line2"><span class="s-label__script" data-copy="label.script"></span><span data-copy="label.year"></span></span>
          </p>
        </div>

        <img class="s-item s-bow" style="--d:650ms" data-anim="pop" src="assets/black-bow.webp" width="207" height="190" alt="" decoding="async">

        <img class="s-item s-bottle" style="--d:1000ms" data-anim="rise" src="assets/bottle.webp" width="142" height="497" alt="" decoding="async">
        <img class="s-item s-ribbon" style="--d:1250ms" data-anim="swing" src="assets/gold-ribbon.webp" width="224" height="175" alt="" decoding="async">
        <span class="s-item s-candle" style="--d:1100ms" data-anim="rise">
          <img src="assets/candle.webp" width="242" height="386" alt="" decoding="async">
          <i class="s-candle__glow" aria-hidden="true"></i>
        </span>

        <img class="s-item s-gift s-gift--black" style="--d:1050ms" data-anim="drop" src="assets/gift-black.webp" width="304" height="310" alt="" decoding="async">
        <img class="s-item s-gift s-gift--red" style="--d:1180ms" data-anim="drop" src="assets/gift-red.webp" width="204" height="223" alt="" decoding="async">
        <img class="s-item s-gift s-gift--cream" style="--d:1300ms" data-anim="drop" src="assets/gift-cream.webp" width="194" height="212" alt="" decoding="async">

        <a class="s-item details-btn" style="--d:1500ms" data-anim="fade" href="#details" id="detailsBtn"><span data-copy="button.details"></span></a>
      </div>
    </section>

    <!-- =========================================================
         3. PROGRAM / DETAILS  (placeholder: replace this whole
            <section> + details.css in part 2)
         ========================================================= -->
    <section class="details" id="details" aria-labelledby="detailsTitle" hidden>
      <div class="details__panel">
        <p class="details__eyebrow" data-copy="details.eyebrow"></p>
        <h2 class="details__title" id="detailsTitle" data-copy="details.title"></h2>
        <p class="details__meta"><span data-copy="card.date"></span> · <span data-copy="card.time"></span></p>
        <!-- the .ics file holds the calendar event: edit it if the date/time/venue change -->
        <a class="details__cal" href="assets/tsd-christmas-party-2026.ics" download="TSD-Christmas-Party-2026.ics" type="text/calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 7v10H5V9h14Zm-8 2v3H8v2h3v3h2v-3h3v-2h-3v-3h-2Z"/></svg>
          <span data-copy="details.calendarButton"></span>
        </a>
      </div>
    </section>
    <!-- ======================= END DETAILS ======================= -->
  </main>

  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

  <button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Mute music" hidden>
    <svg class="sound__on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
    <svg class="sound__off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.6 3 2.7-2.7-1.3-1.3-2.7 2.7-2.7-2.7-1.3 1.3 2.7 2.7-2.7 2.7 1.3 1.3 2.7-2.7 2.7 2.7 1.3-1.3-2.7-2.7Z"/></svg>
  </button>
</body>
</html>
